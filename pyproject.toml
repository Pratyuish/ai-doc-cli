[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-doc-cli"
version = "1.0.0"
authors = [
    { name = "Pratyuish" }
]
description = "An AI-powered Python Code Documentation CLI Tool"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "openai>=1.0.0",
]

[project.scripts]
ai-doc = "doc_generator.cli:main"
